<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prueba 2: Tiempo de Reacción de Enfoque</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
.reticle{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border:2px solid white;border-radius:50%;pointer-events:none}
</style>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex flex-col items-center justify-center p-6 overflow-hidden select-none">
  
  <div class="absolute top-6 text-center">
    <h2 class="text-xl font-semibold">Prueba de Enfoque y Reflejos Oculares</h2>
    <p class="text-xs text-slate-400 mt-1">Mueve la pantalla para ubicar el círculo verde dentro de la retícula central.</p>
  </div>

  <!-- Retícula central -->
  <div class="reticle"></div>

  <!-- Objetivo dinámico -->
  <div id="target" onclick="hitTarget()" class="absolute w-14 h-14 rounded-full bg-emerald-500/40 border-2 border-emerald-400 flex items-center justify-center cursor-pointer transition-all scale-0">
    <div class="w-4 h-4 bg-white rounded-full"></div>
  </div>

  <div class="absolute bottom-10 bg-slate-900 border border-slate-800 p-4 rounded-2xl text-center max-w-sm w-full">
    <div class="text-xs text-slate-400">Último tiempo de reacción:</div>
    <div id="reactionResult" class="text-2xl font-bold text-emerald-400">-- ms</div>
    <button onclick="spawnTarget()" class="mt-3 w-full py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 font-medium text-white text-sm">Iniciar Prueba</button>
  </div>

<script>
let startTime = 0;
let testActive = false;

function spawnTarget() {
  const target = document.getElementById('target');
  // Posición aleatoria en la pantalla
  const x = Math.random() * (window.innerWidth - 100) + 50;
  const y = Math.random() * (window.innerHeight - 200) + 100;

  target.style.left = `${x}px`;
  target.style.top = `${y}px`;
  target.classList.remove('scale-0');
  target.classList.add('scale-100');

  startTime = performance.now();
  testActive = true;
}

function hitTarget() {
  if (!testActive) return;
  const reactionTime = performance.now() - startTime;
  testActive = false;

  document.getElementById('reactionResult').textContent = `${reactionTime.toFixed(0)} ms`;
  const target = document.getElementById('target');
  target.classList.remove('scale-100');
  target.classList.add('scale-0');

  // Repetir prueba automáticamente tras 2 segundos
  setTimeout(spawnTarget, 2000);
}
</script>
</body>
</html>
